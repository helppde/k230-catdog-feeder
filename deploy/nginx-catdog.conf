# 阿里云 ECS 上的 nginx 反代配置
#
# 作用：让 K230 用 https://你的域名 访问，nginx 接到 443 再转给本机 8000。
#   好处 1：TLS 由 nginx 处理，Python 那边不用碰证书
#   好处 2：8000 只监听 127.0.0.1，公网根本连不到，安全组也不用开 8000
#
# 用法：
#   1. 把 catdog.example.com 换成你的域名（阿里云要**先备案**，见 README）
#   2. 证书用阿里云"数字证书管理服务"申请免费 DV 证书，下载 nginx 格式
#   3. sudo cp 本文件 /etc/nginx/conf.d/catdog.conf
#   4. sudo nginx -t && sudo systemctl reload nginx

# ---- 80 全部跳 https ----
server {
    listen 80;
    listen [::]:80;
    server_name catdog.example.com;

    # 阿里云证书的域名校验文件放这里（申请证书时用）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

# ---- 443 ----
server {
    # 注意：这里用 listen ... http2 而不是 "http2 on;"。
    # 后者要 nginx 1.25.1+，Ubuntu 22.04 自带 1.18 会直接报 unknown directive。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name catdog.example.com;

    # 阿里云下载的 nginx 证书一般是这两个名字
    ssl_certificate     /etc/nginx/ssl/catdog.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/catdog.example.com.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传的是照片。nginx 默认只允许 1MB，不改会直接 413。
    # 服务端自己限制 4MB，这里放宽到 8MB 留余量。
    client_max_body_size 8m;

    access_log /var/log/nginx/catdog.access.log;
    error_log  /var/log/nginx/catdog.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # K230 传图可能慢，别让 nginx 提前掐断
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 上传大文件时不要缓冲到磁盘再转发，直接流
        proxy_request_buffering off;
    }

    # 网页没有登录鉴权，公网暴露前建议至少加一层 Basic Auth
    # （或者只让自己通过 VPN 访问）
    #
    # auth_basic           "catdog";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
